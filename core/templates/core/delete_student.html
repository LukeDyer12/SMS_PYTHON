{% extends "site/base.html" %}


{% block title %}Delete Student{% endblock %}

{% block content %}
<h1 class="mb-4">Delete Student</h1>

<p>Are you sure you want to delete <strong>{{ student.first_name }} {{ student.last_name }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
