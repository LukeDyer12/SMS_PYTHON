{% extends "site/base.html" %}


{% block title %}Teachers{% endblock %}

{% block content %}
<h1 class="mb-4">Teachers</h1>

<p>
    <a href="{% url 'create_teacher' %}" class="btn btn-primary">Add New Teacher</a>
</p>

<table class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th style="width: 150px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for teacher in teachers %}
            <tr>
<td>
    <a href="{% url 'teacher_detail' teacher.pk %}">
        {{ teacher.user.get_full_name }}
    </a>
</td>

                <td>{{ teacher.subject }}</td>
                <td>
                    <a href="{% url 'edit_teacher' teacher.pk %}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="{% url 'delete_teacher' teacher.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back to Home</a>
{% endblock %}
