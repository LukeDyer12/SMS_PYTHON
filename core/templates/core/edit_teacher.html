{% extends "site/base.html" %}


{% block title %}Edit {{ teacher.first_name }} {{ teacher.last_name }}{% endblock %}

{% block content %}
<h1 class="mb-4">Edit Teacher</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'teacher_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
