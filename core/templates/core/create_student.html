{% extends "site/base.html" %}


{% block title %}Add Student{% endblock %}

{% block content %}
<h1>Add New Student</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Create Student</button>
</form>

<p><a href="{% url 'student_list' %}">Cancel</a></p>
{% endblock %}
