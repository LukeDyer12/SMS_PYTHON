{% extends "site/base.html" %}


{% block title %}Delete Teacher{% endblock %}

{% block content %}
<h1 class="mb-4">Delete Teacher</h1>

<p>Are you sure you want to delete <strong>{{ teacher.user.get_full_name }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'teacher_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
