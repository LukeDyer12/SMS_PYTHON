{% extends "site/base.html" %}


{% block title %}Students{% endblock %}

{% block content %}
<h1 class="mb-4">Students</h1>

<p>
    <a href="{% url 'create_student' %}" class="btn btn-primary">Add New Student</a>
</p>

<table class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th style="width: 150px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
            <tr>
                <td>
                    <a href="{% url 'student_detail' student.pk %}">
                        {{ student.first_name }} {{ student.last_name }}
                    </a>
                </td>
                <td>
                    <a href="{% url 'edit_student' student.pk %}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="{% url 'delete_student' student.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    <a href="{% url 'student_detail' student.id %}">View Profile</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back to Home</a>
{% endblock %}
